services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexatopup
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      POSTGRES_DB: nexatopup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexatopup -d nexatopup"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://nexatopup:${DB_PASSWORD:?Set DB_PASSWORD in .env.production}@postgres:5432/nexatopup?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://nexatopup:${DB_PASSWORD:?Set DB_PASSWORD in .env.production}@postgres:5432/nexatopup?schema=public
      SEED_ADMIN_EMAIL: ""
      SEED_ADMIN_PASSWORD: ""
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
